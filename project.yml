name: eEntryAI
options:
  bundleIdPrefix: com.eEntryAI
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

targets:
  eEntryAI:
    type: application
    platform: iOS
    sources:
      - path: eEntryAI
      - path: packs
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eEntryAI.app
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"      # iPhone only
        # Ad-hoc signing: required on modern simulators for Keychain items —
        # without embedded entitlements, SecItemAdd fails with -34018
        # (errSecMissingEntitlement). Ad-hoc needs no Apple developer account.
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGN_IDENTITY: "-"
        AD_HOC_CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGN_ENTITLEMENTS: eEntryAI/eEntryAI.entitlements

  eEntryAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: eEntryAITests
    dependencies:
      - target: eEntryAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eEntryAI.app.tests
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/eEntryAI.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)eEntryAI"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGN_IDENTITY: "-"

schemes:
  eEntryAI:
    build:
      targets:
        eEntryAI: all
        eEntryAITests: [test]
    test:
      targets:
        - eEntryAITests
